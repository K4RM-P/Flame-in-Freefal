# SI-assisted: written with Claude Code (Anthropic); see README "Use of AI (SI)".
# Builds the EmberAtlas web app as a static site and deploys it to GitHub Pages.
# One-time repo setting (admin): Settings → Pages → Build and deployment → Source = "GitHub Actions".
# The static site has no server, so /api/ask is removed before the build and Ask serves the 12 cached golden answers.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --no-frozen-lockfile
      - name: Remove the server-only Ask route (static hosting)
        run: rm -rf web/app/api
      - name: Static export
        run: pnpm -C web build
        env:
          NEXT_PUBLIC_ASTER_URL: ${{ vars.ASTER_URL }}
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
