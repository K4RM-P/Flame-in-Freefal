spread:
  C_thin: {value: 0.7853981633974483, units: "-", note: "pi/4 with FULL thickness d (Quintiere simplified de Ris). de Ris exact form sqrt(2)/tau with tau=d/2 equals 2*sqrt(2)/d, i.e. 3.6x larger; the PRD's claimed equivalence is incorrect (see HUMAN_TASKS).", source: quintiere-ffp, status: ok}
  blend_exponent: {value: 4.0, units: "-", note: "smooth-max p-norm blend of thin and thick limits (numerical choice, not a property)", source: "numerical choice", status: ok}
  low_flow_quench_cm_s: {value: 5.0, units: cm/s, note: "BASS-II flames sensitive to flow in 0-5 cm/s; some survive below 1 cm/s", source: bass2-sci-rep-2017, status: TODO_VERIFY}

droplet:
  # Planck-mean absorption * hot-volume fraction is FITTED (a_eff); this is only a prior used before fitting
  a_eff_prior: {value: 0.5, units: 1/m, source: chao-law-tien-1990, status: TODO_VERIFY}

suppression:
  # Literature T_crit (1500-1600 K, Beyler) uses a premixed/reactant-based T_ad convention and is NOT
  # comparable with our product-based SU1 T_ad. For a consistent 1 g reference we evaluate SU1 at the
  # n-heptane cup-burner N2 minimum extinguishing concentration (MEC) dispersed into air.
  T_crit_literature: {value: 1600.0, units: K, note: "reference only (different T_ad convention)", source: sfpe-beyler, status: TODO_VERIFY}
  cup_burner_N2_MEC_heptane: {value: 0.32, units: "mole fraction N2 added to air", note: "candidate 30-34 vol%", source: nfpa-2001, status: TODO_VERIFY, dist: {type: uniform, lo: 0.30, hi: 0.34}}

smoke:
  N0_default: {value: 1.0e12, units: 1/m3, note: "placeholder until SAME-R fit; typical smoldering smoke number concentration order", source: same-r, status: TODO_VERIFY}
  d0_default_nm: {value: 100.0, units: nm, source: same-r, status: TODO_VERIFY}
  sigma_g: {value: 1.32, units: "-", note: "self-preserving size distribution for Brownian coagulation (continuum ~1.32)", source: seinfeld-pandis, status: TODO_VERIFY}
  photoelectric_threshold_nm: {value: 300.0, units: nm, note: "photoelectric (scattering) favours d > ~0.3 um", source: same-r, status: TODO_VERIFY}
  particle_density: {value: 1000.0, units: kg/m3, note: "unit-density convention used in the PSI-47 DAFT workbook (density 1.0 g/cm3); real smoke/soot densities differ", source: PSI-47, locator: "PSI-47_Analyzed Data_DAFT Retrieved Data Summary.xls, sheet 'Logged Data Summary', cell D20", status: TODO_VERIFY}

habitat:
  h_w: {value: 5.0, units: W/m2/K, note: "uncalibrated prior for cabin wall convection; to be fitted on Saffire", source: ntrs-20210011521, status: TODO_VERIFY, dist: {type: uniform, lo: 2.0, hi: 15.0}}
  chi_r_lost: {value: 0.0, units: "-", note: "fraction of HRR not heating cabin gas (absorbed directly by walls)", source: ntrs-20210011521, status: TODO_VERIFY, dist: {type: uniform, lo: 0.0, hi: 0.3}}
