# Property values used by emberphys. status: ok | TODO_VERIFY (see docs/HUMAN_TASKS.md).
# dist: Monte Carlo distribution {type: normal, sd} or {type: uniform, lo, hi}; omitted => fixed.
constants:
  R_univ: {value: 8.314462618, units: J/mol/K, source: "CODATA 2018", status: ok}
  sigma_SB: {value: 5.670374419e-8, units: W/m2/K4, source: "CODATA 2018", status: ok}
  k_B: {value: 1.380649e-23, units: J/K, source: "CODATA 2018 (exact)", status: ok}
  g0: {value: 9.80665, units: m/s2, source: "CGPM 1901 standard gravity", status: ok}
  P_atm: {value: 101325.0, units: Pa, source: "standard atmosphere", status: ok}
  T_amb: {value: 298.15, units: K, source: "assumed cabin/test ambient (FLEX chamber ~room temp)", status: ok}
  dH_O2: {value: 13.1e6, units: J/kg_O2, source: huggett-1980, status: ok, dist: {type: normal, sd: 0.065e6}}

atomic_weights:   # g/mol, source iupac-2021
  C: 12.011
  H: 1.008
  O: 15.999
  N: 14.007
  He: 4.0026
  Ar: 39.948

species:          # composition for molar mass; thermo from thermo30.dat (gri30) except He
  O2: {formula: {O: 2}}
  N2: {formula: {N: 2}}
  CO2: {formula: {C: 1, O: 2}}
  H2O: {formula: {H: 2, O: 1}}
  CO: {formula: {C: 1, O: 1}}
  AR: {formula: {Ar: 1}}
  HE: {formula: {He: 1}, nasa7_constant_cp_over_R: 2.5, source: nist-webbook-he}

transport:
  air_sutherland_mu: {mu0: 1.716e-5, T0: 273.15, S: 110.4, units: "Pa s, K", source: white-vfm, status: ok}
  air_sutherland_k: {k0: 0.0241, T0: 273.15, S: 194.0, units: "W/m/K, K", source: white-vfm, status: ok}
  # species conductivity k(T) = k300 * (T/300)^n ; n from Incropera Table A.4 values at 300 K and 1000 K (CO2: 300-800 K)
  k_species:
    O2: {k300: 0.0268, n: 0.817, source: incropera, status: TODO_VERIFY}
    N2: {k300: 0.0259, n: 0.761, source: incropera, status: TODO_VERIFY}
    CO2: {k300: 0.01655, n: 1.03, source: incropera, status: TODO_VERIFY}
    HE: {k300: 0.152, n: 0.703, source: incropera, status: TODO_VERIFY}
    AR: {k300: 0.0177, n: 0.72, source: incropera, status: TODO_VERIFY}
    H2O: {k300: 0.0196, n: 1.12, source: incropera, status: TODO_VERIFY}

