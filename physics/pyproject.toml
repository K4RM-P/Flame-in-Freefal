[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberphys"
version = "0.1.0"
description = "Validated microgravity combustion physics for spacecraft fire safety (EmberAtlas, NASA Space Apps 2026)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "pandas==2.2.2", "pyarrow==16.1.0",
  "scikit-learn==1.5.0", "pyyaml==6.0.1",
]

[project.optional-dependencies]
pipeline = ["pdfplumber==0.11.0", "tabulate==0.9.0"]
dev = ["pytest==8.2.2"]

[tool.setuptools]
packages = ["emberphys"]

[tool.setuptools.package-data]
emberphys = []

[tool.pytest.ini_options]
testpaths = ["tests"]
